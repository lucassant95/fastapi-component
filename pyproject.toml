[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-component"
version = "0.3.0"
description = "FastAPI integration for python-components: run a component System inside the application lifespan"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["fastapi", "component", "lifecycle", "lifespan", "dependency-injection", "system"]
authors = [
    { name = "Lucas Sant'Anna", email = "lucassant95@gmail.com" }
]
maintainers = [
    { name = "Lucas Sant'Anna", email = "lucassant95@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "python-components>=0.4.0,<0.5",
]

[project.urls]
Homepage = "https://github.com/lucassant95/fastapi-component"
Documentation = "https://github.com/lucassant95/fastapi-component#readme"
Repository = "https://github.com/lucassant95/fastapi-component"
Issues = "https://github.com/lucassant95/fastapi-component/issues"
Changelog = "https://github.com/lucassant95/fastapi-component/releases"

[project.optional-dependencies]
auth = [
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "pytest>=8.4.2",
    # Upper-bounded: CI resolves fresh (no committed lockfile) and ruff minor
    # releases change default rule/format behavior, breaking style checks on
    # untouched code. Bump deliberately, together with any new findings.
    "ruff>=0.14.2,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["fastapi_component"]
exclude = ["fastapi_component/tests"]

[tool.ruff]
# Markdown code blocks are hand-formatted for documentation readability;
# newer ruff releases format them by default, and CI resolves ruff fresh
# (no committed lockfile), so exclude them to keep CI version-drift-proof.
extend-exclude = ["*.md"]
